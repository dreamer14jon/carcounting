<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Counting Game</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #dff4ff, #fff7ef);
      color: #234;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .game {
      width: 100%;
      max-width: 760px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.12);
      padding: 20px;
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }
    .subtitle {
      margin-bottom: 16px;
      color: #4b5b66;
    }
    .topbar {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .pill {
      background: #eef8ff;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: bold;
    }
    .road {
      background: linear-gradient(180deg, #b9ebff 0 52%, #6d7785 52% 100%);
      border-radius: 24px;
      padding: 20px 14px 24px;
      min-height: 260px;
      position: relative;
      overflow: hidden;
    }
    .cloud {
      position: absolute;
      font-size: 2rem;
      opacity: 0.85;
    }
    .cloud.one { top: 12px; left: 28px; }
    .cloud.two { top: 18px; right: 34px; }
    .cars {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(95px, 1fr));
      gap: 12px;
      margin-top: 64px;
      margin-bottom: 20px;
      position: relative;
      z-index: 2;
    }
    .car {
      background: rgba(255,255,255,0.8);
      border-radius: 18px;
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.2rem;
    }
    .lane-line {
      height: 10px;
      width: 100%;
      background: repeating-linear-gradient(90deg, #fff 0 42px, transparent 42px 70px);
      border-radius: 999px;
    }
    .question {
      font-size: 1.5rem;
      font-weight: bold;
      margin: 18px 0 14px;
    }
    .answers {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 420px;
      margin: 0 auto;
    }
    button {
      border: none;
      border-radius: 18px;
      padding: 16px 12px;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      background: #ffd36f;
      color: #4c3a00;
    }
    button:hover { filter: brightness(0.98); }
    button:disabled { opacity: 0.65; cursor: default; }
    .status {
      min-height: 28px;
      margin: 14px 0 8px;
      font-weight: bold;
      font-size: 1.1rem;
    }
    .controls {
      margin-top: 8px;
    }
    .next-btn {
      background: #cfe7ff;
      color: #234;
      min-width: 170px;
    }
    @media (max-width: 560px) {
      h1 { font-size: 1.7rem; }
      .question { font-size: 1.25rem; }
      .answers { grid-template-columns: repeat(2, 1fr); }
      .car { font-size: 2.7rem; min-height: 76px; }
      button { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="game">
    <h1>🚗 Car Counting Game</h1>
    <div class="subtitle">Count the cars and tap the right number.</div>

    <div class="topbar">
      <div class="pill">Stars: <span id="score">0</span> ⭐</div>
      <div class="pill">Round: <span id="round">1</span></div>
    </div>

    <div class="road">
      <div class="cloud one">☁️</div>
      <div class="cloud two">☁️</div>
      <div class="cars" id="cars"></div>
      <div class="lane-line"></div>
    </div>

    <div class="question" id="question">How many cars do you see?</div>
    <div class="answers" id="answers"></div>
    <div class="status" id="status"></div>
    <div class="controls">
      <button class="next-btn" id="nextBtn" style="display:none;">Next Round</button>
    </div>
  </div>

  <script>
    const carChoices = ['🚗','🚙','🏎️','🚕','🚓'];
    let score = 0;
    let round = 1;
    let correctAnswer = 0;

    const scoreEl = document.getElementById('score');
    const roundEl = document.getElementById('round');
    const carsEl = document.getElementById('cars');
    const answersEl = document.getElementById('answers');
    const statusEl = document.getElementById('status');
    const nextBtn = document.getElementById('nextBtn');

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function makeRound() {
      statusEl.textContent = '';
      nextBtn.style.display = 'none';
      carsEl.innerHTML = '';
      answersEl.innerHTML = '';
      roundEl.textContent = round;

      correctAnswer = Math.floor(Math.random() * 5) + 1;

      for (let i = 0; i < correctAnswer; i++) {
        const car = document.createElement('div');
        car.className = 'car';
        car.textContent = carChoices[Math.floor(Math.random() * carChoices.length)];
        carsEl.appendChild(car);
      }

      const options = new Set([correctAnswer]);
      while (options.size < 4) {
        options.add(Math.floor(Math.random() * 5) + 1);
      }

      shuffle([...options]).forEach(num => {
        const btn = document.createElement('button');
        btn.textContent = num;
        btn.addEventListener('click', () => checkAnswer(num));
        answersEl.appendChild(btn);
      });
    }

    function checkAnswer(num) {
      answersEl.querySelectorAll('button').forEach(btn => btn.disabled = true);

      if (num === correctAnswer) {
        score += 1;
        scoreEl.textContent = score;
        statusEl.textContent = 'Great job! That is right! 🎉';
      } else {
        statusEl.textContent = `Nice try! The answer is ${correctAnswer}.`;
      }

      round += 1;
      nextBtn.style.display = 'inline-block';
    }

    nextBtn.addEventListener('click', makeRound);
    makeRound();
  </script>
</body>
</html>
